<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>UltraERP</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Tela de login -->
  <div id="view-login" class="view">
    <div class="login-card">
      <h1 class="login-logo">Ultra<span>ERP</span></h1>
      <p class="login-sub">Gestão simples para a sua loja</p>
      <form id="login-form" novalidate>
        <label for="login-email">E-mail</label>
        <input id="login-email" type="email" autocomplete="username"
               placeholder="nome@empresa.com.br">
        <label for="login-password">Senha</label>
        <input id="login-password" type="password" autocomplete="current-password"
               placeholder="Sua senha">
        <div class="remember-row">
          <label class="checkbox">
            <input id="remember-email" type="checkbox"> Lembrar e-mail
          </label>
          <label class="checkbox">
            <input id="remember-password" type="checkbox"> Lembrar senha
          </label>
        </div>
        <p id="login-error" class="field-error" hidden></p>
        <button type="submit" id="login-btn" class="btn-primary">Entrar</button>
      </form>
      <p class="login-alt">Ainda não tem conta?
        <a href="#" id="ir-cadastro">Criar conta</a></p>
      <p id="demo-badge" class="demo-badge" hidden>Modo demonstração — sem servidor configurado</p>
    </div>
  </div>

  <!-- Tela de cadastro (conta + loja) -->
  <div id="view-cadastro" class="view" hidden>
    <div class="login-card cadastro-card">
      <h1 class="login-logo">Ultra<span>ERP</span></h1>
      <p class="login-sub">Crie sua conta e comece o teste grátis de 14 dias</p>
      <form id="cadastro-form" novalidate>
        <fieldset class="cad-secao">
          <legend>Seus dados de acesso</legend>
          <div class="grid-2">
            <div><label for="cad-email">E-mail *</label>
              <input id="cad-email" name="email" type="email" autocomplete="email" placeholder="nome@empresa.com.br">
              <p class="field-error" data-erro="email" hidden></p></div>
            <div><label for="cad-nome">Seu nome *</label>
              <input id="cad-nome" name="nome_usuario" placeholder="Como você quer ser chamado">
              <p class="field-error" data-erro="nome_usuario" hidden></p></div>
            <div><label for="cad-senha">Senha * <span class="hint" title="Pelo menos 6 caracteres.">?</span></label>
              <input id="cad-senha" name="senha" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
              <p class="field-error" data-erro="senha" hidden></p></div>
            <div><label for="cad-senha2">Confirmar senha *</label>
              <input id="cad-senha2" name="senha2" type="password" autocomplete="new-password" placeholder="Repita a senha">
              <p class="field-error" data-erro="senha2" hidden></p></div>
          </div>
        </fieldset>
        <fieldset class="cad-secao">
          <legend>Dados da loja</legend>
          <div class="grid-2">
            <div><label for="cad-cnpj">CNPJ *</label>
              <input id="cad-cnpj" name="cnpj" inputmode="numeric" placeholder="00.000.000/0000-00">
              <p class="field-error" data-erro="cnpj" hidden></p></div>
            <div><label for="cad-uf">Estado (UF) *</label>
              <select id="cad-uf" name="uf">
                <option value="">Selecione…</option>
              </select>
              <p class="field-error" data-erro="uf" hidden></p></div>
            <div><label for="cad-razao">Razão social *</label>
              <input id="cad-razao" name="razao_social" placeholder="Nome da empresa no CNPJ">
              <p class="field-error" data-erro="razao_social" hidden></p></div>
            <div><label for="cad-fantasia">Nome fantasia</label>
              <input id="cad-fantasia" name="nome_fantasia" placeholder="Nome que aparece na loja (opcional)"></div>
          </div>
        </fieldset>
        <p id="cadastro-error" class="field-error" hidden></p>
        <button type="submit" id="cadastro-btn" class="btn-primary">Criar conta e entrar</button>
      </form>
      <p class="login-alt">Já tem conta? <a href="#" id="ir-login">Voltar ao login</a></p>
    </div>
  </div>

  <!-- Shell principal (multi-abas) -->
  <div id="view-shell" class="view" hidden>
    <header class="topbar">
      <span class="brand">Ultra<span>ERP</span></span>
      <nav id="tabbar" class="tabbar" aria-label="Abas abertas"></nav>
      <div class="topbar-actions">
        <button id="config-btn" class="icon-btn" title="Configuração fiscal (NFC-e)">⚙</button>
        <button id="theme-toggle" class="icon-btn" title="Alternar tema claro/escuro">◐</button>
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn" class="icon-btn" title="Sair">⏻</button>
      </div>
    </header>
    <div class="body">
      <aside class="sidebar">
        <ul id="module-menu" class="module-menu"></ul>
      </aside>
      <main id="tab-panels" class="tab-panels"></main>
    </div>
    <footer id="license-banner" class="license-banner" hidden></footer>

    <!-- Modal de configuração fiscal (NFC-e) -->
    <div id="fiscal-modal" class="modal-overlay" hidden>
      <div class="modal">
        <div class="modal-head">
          <h3>Configuração fiscal (NFC-e)</h3>
          <button class="modal-close" id="fiscal-modal-close" title="Fechar">✕</button>
        </div>
        <div class="modal-body" id="fiscal-modal-body"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/fiscal.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/estoque.js"></script>
  <script src="js/modules/pdv.js"></script>
  <script src="js/modules/caixa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
