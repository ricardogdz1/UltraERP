<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>UltraERP</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Tela de login -->
  <div id="view-login" class="view">
    <div class="login-card">
      <h1 class="login-logo">Ultra<span>ERP</span></h1>
      <p class="login-sub">Gestão simples para a sua loja</p>
      <form id="login-form" novalidate>
        <label for="login-email">E-mail</label>
        <input id="login-email" type="email" autocomplete="username"
               placeholder="nome@empresa.com.br">
        <label for="login-password">Senha</label>
        <input id="login-password" type="password" autocomplete="current-password"
               placeholder="Sua senha">
        <div class="remember-row">
          <label class="checkbox">
            <input id="remember-email" type="checkbox"> Lembrar e-mail
          </label>
          <label class="checkbox">
            <input id="remember-password" type="checkbox"> Lembrar senha
          </label>
        </div>
        <p id="login-error" class="field-error" hidden></p>
        <button type="submit" id="login-btn" class="btn-primary">Entrar</button>
      </form>
      <p id="demo-badge" class="demo-badge" hidden>Modo demonstração — sem servidor configurado</p>
    </div>
  </div>

  <!-- Shell principal (multi-abas) -->
  <div id="view-shell" class="view" hidden>
    <header class="topbar">
      <span class="brand">Ultra<span>ERP</span></span>
      <nav id="tabbar" class="tabbar" aria-label="Abas abertas"></nav>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-btn" title="Alternar tema claro/escuro">◐</button>
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn" class="icon-btn" title="Sair">⏻</button>
      </div>
    </header>
    <div class="body">
      <aside class="sidebar">
        <ul id="module-menu" class="module-menu"></ul>
      </aside>
      <main id="tab-panels" class="tab-panels"></main>
    </div>
    <footer id="license-banner" class="license-banner" hidden></footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/modules/estoque.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
